name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A new skeleton has no package.json or lock file yet; npm ci waits for one.
      - run: npm ci
        if: hashFiles('package-lock.json') != ''
      - run: node scripts/check.mjs
